<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claim Check</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><span class="logo" aria-hidden="true">✓</span>Claim Check</h1>
    <p class="sub">A preliminary screen, not a final answer. You decide what to trust or share.</p>
  </header>

  <section>
    <input type="hidden" id="mode" value="mock">
    <div class="seg" role="radiogroup" aria-label="Source of results">
      <button type="button" role="radio" data-mode="mock" aria-checked="true">Mock</button>
      <button type="button" role="radio" data-mode="benchmark" aria-checked="false">Benchmark</button>
      <button type="button" role="radio" data-mode="live" aria-checked="false">Live</button>
    </div>
    <p id="modeHint" class="hint"></p>

    <div id="scenarioRow" hidden>
      <label for="scenario" id="scenarioLabel">Sample outcome</label>
      <input id="search" type="search" placeholder="Search demo claims" hidden>
      <select id="scenario"></select>
    </div>

    <label for="claim">Claim</label>
    <textarea id="claim" rows="3" maxlength="2000" placeholder="Select text on a page, or type or paste a claim"></textarea>
    <div class="tools">
      <button id="useSelection" type="button" class="link">Use selected text</button>
      <span aria-hidden="true">·</span>
      <button id="pasteClip" type="button" class="link">Paste from clipboard</button>
    </div>
    <button id="check" type="button" class="primary">Check this claim</button>
  </section>

  <section id="result" aria-live="polite"></section>

  <details class="settings">
    <summary>Backend settings</summary>
    <label for="backend">Backend URL</label>
    <input id="backend" value="http://127.0.0.1:8000">
  </details>

  <script src="mock.js"></script>
  <script src="popup.js"></script>
</body>
</html>
